kind = "web"
previewPath = "/"
title = "Anderson Futbol Lab"
version = "1.0.0"
id = "artifacts/anderson-futbol-lab"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21165

[services.development]
run = "pnpm --filter @workspace/anderson-futbol-lab run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/anderson-futbol-lab", "run", "build" ]
serve = "static"
publicDir = "artifacts/anderson-futbol-lab/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21165"
BASE_PATH = "/"
